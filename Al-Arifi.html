:root{--primary:#4CAF50;--primary-dark:#2E7D32;--card:#1e1e1e;--text:#fff;--muted:#aaa;--radius:15px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#111,#222 50%,#333);color:var(--text);min-height:100vh;padding:18px 12px 60px;}
.controls-container{display:flex;align-items:center;justify-content:space-between;max-width:680px;margin:0 auto 16px;gap:10px;}
.back-btn,.share-btn{background:#2196F3;color:#fff;border:none;padding:9px 18px;border-radius:22px;font-family:'Cairo';font-weight:700;cursor:pointer;font-size:.9em;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.share-btn{background:var(--primary);}
h1{text-align:center;color:var(--primary);font-size:1.7em;margin:8px 0 2px;}
.subtitle{text-align:center;color:var(--muted);margin-bottom:6px;}
.second-title{text-align:center;font-family:'Amiri',serif;background:linear-gradient(45deg,#FF9800,#FFC107);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:1.5em;font-weight:700;margin:6px 0 20px;}
.player-wrap{max-width:680px;margin:0 auto 22px;background:var(--card);border:2px solid var(--primary);border-radius:var(--radius);padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.now{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;color:var(--primary);min-height:26px;justify-content:center;}
.eq{display:flex;align-items:center;justify-content:center;gap:4px;height:26px;}
.eq span{width:6px;height:6px;border-radius:3px;background:linear-gradient(to top,#2E7D32,#81C784);}
.playing .eq span{animation:eq 1s ease-in-out infinite;}
.eq span:nth-child(1){animation-duration:.8s}.eq span:nth-child(2){animation-duration:.6s}.eq span:nth-child(3){animation-duration:1s}.eq span:nth-child(4){animation-duration:.7s}.eq span:nth-child(5){animation-duration:.9s}
@keyframes eq{0%,100%{height:6px}50%{height:24px}}
video{width:100%;border-radius:12px;background:#000;max-height:240px;}
.parts{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.part-card{background:var(--card);border:1px solid #333;border-radius:var(--radius);padding:16px;text-align:center;}
.part-card h3{color:var(--primary);margin-bottom:12px;font-size:1.1em;}
.part-select{width:100%;padding:13px 16px;border-radius:26px;border:2px solid var(--primary);background:#111;color:var(--text);font-family:'Cairo';font-size:1em;outline:none;cursor:pointer;text-align:center;}
.part-select:focus{box-shadow:0 0 12px rgba(76,175,80,.4);}
.foot{text-align:center;color:var(--muted);margin-top:22px;font-size:.9em;}
</style>

<script>
const player=document.getElementById('player');
const wrap=document.getElementById('playerWrap');
const nowText=document.getElementById('nowText');
const selects=document.querySelectorAll('.part-select');
function playFromSelect(sel){
  const url=sel.value;
  if(!url)return;
  // لما تختار من قائمة، صفّر القوائم التانية
  selects.forEach(s=>{ if(s!==sel) s.value=''; });
  const label=sel.options[sel.selectedIndex].textContent;
  wrap.classList.add('playing');
  nowText.textContent=label+' — نهاية العالم';
  player.src=url;
  player.play().catch(()=>{});
  player.scrollIntoView({behavior:'smooth',block:'center'});
}
player.addEventListener('pause',()=>{ if(player.ended)return; });
function goBack(){ window.location.href='index.html'; }
function shareApp(){
  const data={title:'سلسلة نهاية العالم - الشيخ محمد العريفي',text:'استمع لسلسلة نهاية العالم للشيخ محمد العريفي عبر راديو قرآن',url:window.location.href};
  if(navigator.share){navigator.share(data).catch(()=>{});} else {navigator.clipboard.writeText(window.location.href);alert('تم نسخ الرابط');}
}
</script>
