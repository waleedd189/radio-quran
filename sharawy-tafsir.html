<title>تفسير الشعراوي - راديو قرآن</title>
<meta name="description" content="خواطر الشيخ محمد متولي الشعراوي في تفسير القرآن الكريم.">
<meta name="theme-color" content="#4CAF50">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root{--primary:#4CAF50;--primary-dark:#2E7D32;--card:#1e1e1e;--text:#fff;--muted:#aaa;--radius:15px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#111,#222 50%,#333);color:var(--text);min-height:100vh;padding:16px 12px 60px;}
.wrap{max-width:1000px;margin:0 auto;}
.controls-container{display:flex;align-items:center;justify-content:space-between;margin:0 auto 14px;gap:8px;flex-wrap:wrap;}
.ctl-btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:22px;font-family:'Cairo';font-weight:700;cursor:pointer;font-size:.88em;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.ctl-btn.blue{background:#2196F3;}

.sharawy-image{width:100%;max-height:400px;object-fit:cover;border-radius:15px;margin:0 0 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:block;}
.hero-cap{text-align:center;margin-bottom:18px;}
.hero-cap h1{font-family:'Amiri',serif;font-size:2.2em;color:var(--primary);text-shadow:2px 2px 4px rgba(0,0,0,.5);}
.hero-cap p{color:var(--muted);font-size:.95em;margin-top:4px;}

.player{background:var(--card);border:2px solid var(--primary);border-radius:var(--radius);padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.5);margin-bottom:22px;}
.now{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:700;color:var(--primary);margin-bottom:10px;min-height:26px;flex-wrap:wrap;}
.eq{display:flex;align-items:center;gap:4px;height:24px;}
.eq span{width:5px;height:5px;border-radius:3px;background:linear-gradient(to top,#2E7D32,#81C784);}
.playing .eq span{animation:eq 1s ease-in-out infinite;}
.eq span:nth-child(1){animation-duration:.8s}.eq span:nth-child(2){animation-duration:.6s}.eq span:nth-child(3){animation-duration:1s}.eq span:nth-child(4){animation-duration:.7s}.eq span:nth-child(5){animation-duration:.9s}
@keyframes eq{0%,100%{height:5px}50%{height:22px}}
audio{width:100%;height:44px;border-radius:10px;}
.p-tools{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.tool{background:rgba(255,255,255,.08);color:#fff;border:1px solid #333;padding:8px 14px;border-radius:20px;cursor:pointer;font-family:'Cairo';font-weight:700;font-size:.85em;display:inline-flex;gap:6px;align-items:center;}
.tool.active{background:var(--primary);border-color:var(--primary);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.scard{background:var(--card);border:1px solid #333;border-radius:var(--radius);padding:16px 10px;text-align:center;cursor:pointer;transition:.25s;position:relative;}
.scard:hover{transform:translateY(-6px);border-color:var(--primary);box-shadow:0 10px 24px rgba(0,0,0,.4);}
.scard.active{border-color:var(--primary);background:rgba(76,175,80,.14);box-shadow:inset 0 -3px 0 var(--primary);}
.snum{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#4CAF50,#2E7D32);color:#fff;font-weight:700;font-size:1.1em;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
.scard.intro .snum{background:linear-gradient(135deg,#FF9800,#EF6C00);}
.scard.range{grid-column:1/-1;display:flex;align-items:center;gap:16px;text-align:right;padding:18px 22px;}
.scard.range .snum{margin:0;background:linear-gradient(135deg,#00838F,#00BCD4);flex-shrink:0;width:54px;height:54px;font-size:1em;}
.scard.range .rbody{flex:1;}
.sname{font-family:'Amiri',serif;font-size:1.12em;line-height:1.5;color:var(--text);min-height:44px;display:flex;align-items:center;justify-content:center;}
.scard.range .sname{justify-content:flex-start;min-height:0;font-size:1.25em;}
.sub{color:var(--muted);font-size:.9em;margin-top:4px;}
.bulk-tag{display:inline-block;margin-top:8px;background:rgba(0,188,212,.15);color:#4DD0E1;font-size:.72em;padding:3px 10px;border-radius:10px;font-weight:700;}
.range-go{color:var(--primary);font-size:1.6em;flex-shrink:0;}
.play-ic{margin-top:8px;color:var(--primary);font-size:1em;}
.scard.active .play-ic{color:#fff;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;}
.modal.show{display:flex;}
.modal-box{background:var(--card);border-radius:16px;padding:22px;max-width:320px;width:90%;text-align:center;border:1px solid var(--primary);}
.modal-box h3{color:var(--primary);margin-bottom:14px;}
.timer-opt{display:block;width:100%;margin:6px 0;padding:11px;border-radius:10px;border:1px solid #333;background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-family:'Cairo';font-weight:700;}
.timer-opt:hover{background:var(--primary);}
.modal-cancel{margin-top:10px;background:transparent;color:var(--muted);border:none;cursor:pointer;font-family:'Cairo';}
@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}.sname{font-size:1em;}.hero-cap h1{font-size:1.8em;}}
</style>
</head>

    </div>

  </div>

</div>

<div class="modal" id="sleepModal">

    <button class="timer-opt" onclick="setSleep(30)">30 دقيقة</button>
    <button class="timer-opt" onclick="setSleep(60)">60 دقيقة</button>
    <button class="timer-opt" onclick="setSleep(90)">90 دقيقة</button>
    <button class="timer-opt" onclick="setSleep(0)">إيقاف المؤقت</button>
    <button class="modal-cancel" onclick="closeSleep()">إغلاق</button>
  </div>
</div>

const audio=document.getElementById('audio');
const wrap=document.getElementById('playerWrap');
const nowText=document.getElementById('nowText');
const grid=document.getElementById('grid');
let curIdx=-1, autoNext=false, sleepTimer=null;

/* ---- حفظ آخر موضع استماع (السورة + الثانية) واستكماله عند العودة ---- */
const LS_KEY='sharawy_tafsir_resume_v1';
function loadState(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||{pos:{},last:null};}catch(e){return {pos:{},last:null};} }
function saveState(st){ try{localStorage.setItem(LS_KEY,JSON.stringify(st));}catch(e){} }
let mem=loadState();
let lastSave=0;

function seekToSaved(idx){
  const t=mem.pos[idx];
  if(t && audio.duration && (audio.duration-t)>5){ audio.currentTime=t; }
}

/* حفظ الموضع كل ثانيتين أثناء التشغيل */
audio.addEventListener('timeupdate',()=>{
  const now=Date.now();
  if(now-lastSave<2000) return;
  lastSave=now;
  if(curIdx>=0 && audio.duration){
    mem.pos[curIdx]=audio.currentTime;
    mem.last=curIdx;
    saveState(mem);
  }
});
audio.addEventListener('loadedmetadata',()=>{ seekToSaved(curIdx); });
/* عند انتهاء السورة: نحذف موضعها حتى تبدأ من الأول لاحقًا */
audio.addEventListener('ended',()=>{
  if(curIdx>=0){ delete mem.pos[curIdx]; saveState(mem); }
  if(autoNext && curIdx<SURAHS.length-1) playIndex(curIdx+1);
});

function render(){
  grid.innerHTML='';
  SURAHS.forEach((s,idx)=>{
    const c=document.createElement('div');
    c.className='scard '+s.type;
    c.id='card-'+idx;
    c.onclick=()=>playIndex(idx);
    if(s.type==='range'){
      c.innerHTML='<div class="snum"><i class="fas fa-layer-group"></i></div>'+
        '<div class="rbody"><div class="sname">'+s.name+'</div>'+
        '<div class="sub">'+s.sub+'</div>'+
        '<span class="bulk-tag"><i class="fas fa-circle-info"></i> تسجيل مجمّع — السور غير متوفرة كملفات منفصلة في المصدر</span></div>'+
        '<div class="range-go"><i class="fas fa-play-circle"></i></div>';
    }else{
      const num = s.type==='intro' ? '<i class="fas fa-bookmark"></i>' : s.n;
      c.innerHTML='<div class="snum">'+num+'</div>'+
        '<div class="sname">'+s.name+'</div>'+
        '<div class="play-ic"><i class="fas fa-play-circle"></i></div>';
    }
    grid.appendChild(c);
  });
}

function playIndex(idx){
  if(idx<0||idx>=SURAHS.length)return;
  curIdx=idx; const s=SURAHS[idx];
  document.querySelectorAll('.scard').forEach(c=>c.classList.remove('active'));
  const card=document.getElementById('card-'+idx); if(card)card.classList.add('active');
  wrap.classList.add('playing');
  nowText.textContent=(s.type==='surah'?'تفسير ':s.type==='range'?'تفسير السور ':'')+s.name;
  audio.src=s.file;
  audio.play().catch(e=>{});
  wrap.scrollIntoView({behavior:'smooth',block:'center'});
}


function toggleAuto(){autoNext=!autoNext;document.getElementById('autoBtn').classList.toggle('active',autoNext);}
function openSleep(){document.getElementById('sleepModal').classList.add('show');}
function closeSleep(){document.getElementById('sleepModal').classList.remove('show');}
function setSleep(min){
  if(sleepTimer){clearTimeout(sleepTimer);sleepTimer=null;}
  if(min>0){ sleepTimer=setTimeout(()=>{audio.pause();},min*60000); }
  closeSleep();
}
function shareApp(){
  const data={title:'تفسير الشعراوي - راديو قرآن',text:'استمع إلى خواطر الشعراوي في تفسير القرآن الكريم',url:location.href};
  if(navigator.share)navigator.share(data).catch(()=>{});
  else{navigator.clipboard.writeText(location.href);alert('تم نسخ الرابط');}
}
render();

/* استرجاع آخر جلسة: تحميل السورة وموضعها ومحاولة الاستكمال */
(function restore(){
  const idx=mem.last;
  if(idx==null || idx<0 || idx>=SURAHS.length) return;
  curIdx=idx; const s=SURAHS[idx];
  const card=document.getElementById('card-'+idx); if(card)card.classList.add('active');
  wrap.classList.add('playing');
  nowText.textContent=(s.type==='surah'?'تفسير ':s.type==='range'?'تفسير السور ':'')+s.name;
  audio.src=s.file;
  // بعد تحميل البيانات الوصفية ننتقل لآخر ثانية سمعتها
  audio.addEventListener('loadedmetadata',function once(){
    seekToSaved(idx);
    const t=mem.pos[idx];
    if(t) nowText.textContent='استكمال: '+((s.type==='surah'?'تفسير ':'')+s.name)+' — من '+fmtTime(t);
    audio.removeEventListener('loadedmetadata',once);
  });
  audio.play().catch(()=>{ /* المتصفح قد يمنع التشغيل التلقائي؛ يضغط المستخدم تشغيل فيكمل من نفس الموضع */ });
})();
function fmtTime(sec){ sec=Math.floor(sec); const m=Math.floor(sec/60), s2=sec%60; return m+':'+String(s2).padStart(2,'0'); }
</script>
