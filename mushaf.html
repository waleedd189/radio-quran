<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المصحف الشريف - راديو قرآن</title>
<meta name="theme-color" content="#22302b">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#22302b; --page:#2c3b35; --ink:#ece8da; --ink2:#a9b4ad; --accent:#7fd4c0; --accent2:#d4af6a;
  --gold:#d8b46a; --line:#41504a; --toolbar:#1b2521;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:'Cairo',Tahoma,sans-serif; color:var(--ink);
  background:var(--bg); overflow:hidden; direction:rtl;
  background-image:radial-gradient(circle at 50% 0%, #2a3a34, var(--bg));
}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:820px;margin:0 auto;
  --base:clamp(19px,5.6vw,29px);--fs:1;}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--toolbar);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.tb{width:40px;height:40px;border-radius:10px;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.tb:active{background:var(--accent);}
.ttitle{flex:1;text-align:center;font-weight:800;font-size:15px;line-height:1.3;}
.ttitle small{display:block;font-size:11px;color:#9fb3b0;font-weight:600;}

/* page stage */
.stage{flex:1;overflow:hidden;position:relative;}
.pages{position:absolute;inset:0;}
.folio{position:absolute;inset:0;overflow:auto;padding:8px 10px 6px;
  transition:transform .32s cubic-bezier(.22,1,.36,1); will-change:transform;}
/* ورقة المصحف: لوحة تصميم ثابتة تُكبَّر/تُصغَّر كوحدة (CSS zoom) فتبقى الأسطر الرسمية ثابتة */
.paper{
  width:620px;max-width:100%;margin:0 auto;background:var(--page);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  padding:18px 20px 10px;position:relative;zoom:1;
}
.mlines{display:block;direction:rtl;text-align:center;}
.mline{display:block;direction:rtl;text-align:center;width:100%;white-space:nowrap;
  line-height:2.1;font-size:34px;}
.mw{display:inline-block;direction:ltr;unicode-bidi:isolate;font-size:inherit;
  padding:0 .3px;cursor:default;white-space:nowrap;transition:background .15s;}
.mw:active{background:rgba(216,180,106,.18);border-radius:6px;}
.mw.t-end{color:var(--gold);}
.mw.t-head{display:block;direction:rtl;width:100%;text-align:center;color:var(--accent);
  font-size:1.12em;line-height:1.9;margin:2px 0 6px;white-space:nowrap;}
.mw.t-bism{display:block;direction:rtl;width:100%;text-align:center;margin:0 0 10px;
  font-size:1.22em;line-height:2;white-space:nowrap;}
.pfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:8px;font-size:13px;color:var(--ink2);font-weight:700;}
.pfoot .juz{color:var(--accent);}
.page-num{text-align:center;margin-top:6px;font-size:12.5px;color:var(--ink2);font-weight:700;}

/* overlay pickers */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
.ov.show{display:flex;}
.sheet{background:#20271a;color:var(--ink);width:100%;max-width:820px;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:78vh;display:flex;flex-direction:column;animation:up .25s ease;border-top:1px solid var(--line);}
.sheet-sm{max-height:46vh;}
@keyframes up{from{transform:translateY(40px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
.sheet h3{margin:0 0 14px;color:var(--gold);font-family:'Amiri';font-size:20px;display:flex;justify-content:space-between;align-items:center;}
.sheet h3 .x{background:none;border:none;font-size:20px;color:#9aa08a;cursor:pointer;}
.search{display:flex;align-items:center;gap:8px;background:#141a10;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;}
.search input{flex:1;border:none;outline:none;background:transparent;color:var(--ink);font-family:inherit;font-size:14px;}
.slist{overflow-y:auto;flex:1;}
.sitem{display:flex;align-items:center;gap:12px;padding:11px 10px;border-bottom:1px solid #2c3322;cursor:pointer;border-radius:8px;}
.sitem:active{background:#2c3322;}
.sitem .no{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:#2f3726;color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.sitem .nm{flex:1;}
.sitem .nm b{font-size:15px;color:var(--ink);}
.sitem .nm span{display:block;font-size:11px;color:#9aa08a;}
.sitem .pg{font-size:12px;color:var(--gold);font-weight:700;}
.tip{text-align:center;color:#9aa08a;font-size:12px;padding:6px 10px;}
.fontctl{display:flex;align-items:center;gap:16px;margin:8px 0 16px;}
.fbtn{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#2f3726;color:var(--gold);font-size:18px;cursor:pointer;}
.fbtn:active{background:var(--gold);color:#141a10;}
.fpreview{flex:1;text-align:center;overflow:hidden;}
.fpreview span{font-family:'Amiri',serif;color:var(--ink);font-size:calc(24px * var(--fs,1));transition:font-size .12s;white-space:nowrap;}
#fsRange{width:100%;accent-color:var(--gold);height:6px;}
.frow{text-align:center;margin-top:12px;}
.freset{background:none;border:1px solid var(--line);color:var(--gold);border-radius:20px;padding:9px 20px;font-family:inherit;font-size:13px;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button class="tb" onclick="goHome()" title="الرئيسية"><i class="fas fa-home"></i></button>
    <button class="tb" onclick="turn(-1)" title="السابق"><i class="fas fa-chevron-right"></i></button>
    <div class="ttitle">المصحف الشريف<small id="tSub">صفحة 1</small></div>
    <button class="tb" onclick="turn(1)" title="التالي"><i class="fas fa-chevron-left"></i></button>
    <button class="tb" onclick="openFont()" title="حجم الخط"><i class="fas fa-text-height"></i></button>
    <button class="tb" onclick="openSurahs()" title="الفهرس"><i class="fas fa-list"></i></button>
  </div>

  <div class="stage">
    <div class="pages" id="pages">
      <div class="folio"><div class="paper"><div class="tip" style="margin:auto">جارٍ تحميل المصحف…</div></div></div>
    </div>
    <div class="tip" id="hint">اسحب يمينًا/شمالًا للتنقل بين الصفحات • اضغط <i class="fas fa-list"></i> لاختيار السورة</div>
  </div>
</div>

<!-- surah sheet -->
<div class="ov" id="surahOv" onclick="if(event.target===this)closeSurahs()">
  <div class="sheet">
    <h3>فهرس السور <button class="x" onclick="closeSurahs()"><i class="fas fa-xmark"></i></button></h3>
    <div class="search"><i class="fas fa-search" style="color:#999"></i><input id="surahQ" placeholder="ابحث عن سورة…" oninput="filterSurahs(this.value)"></div>
    <div class="slist" id="surahList"></div>
  </div>
</div>

<!-- font size sheet -->
<div class="ov" id="fontOv" onclick="if(event.target===this)closeFont()">
  <div class="sheet sheet-sm">
    <h3>حجم خط المصحف <button class="x" onclick="closeFont()"><i class="fas fa-xmark"></i></button></h3>
    <div class="fontctl">
      <button class="fbtn" onclick="setFs(fs-0.1)"><i class="fas fa-minus"></i></button>
      <div class="fpreview"><span id="fsPreview">بِسْمِ اللَّهِ</span></div>
      <button class="fbtn" onclick="setFs(fs+0.1)"><i class="fas fa-plus"></i></button>
    </div>
    <input type="range" id="fsRange" min="0.8" max="2.4" step="0.05" value="1" oninput="setFs(parseFloat(this.value))">
    <div class="frow"><button class="freset" onclick="setFs(1)">استعادة الحجم الافتراضي</button></div>
    <div class="tip">التكبير يحافظ على شكل أسطر المصحف الرسمية كما هي؛ تتحكّم بحجم الصفحة فقط.</div>
  </div>
</div>

<script>
const CDN="https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@main";
const TOTAL=604;
const fontLoaded={};
// chapter metadata (snapshot for the index; also used offline-ish)
let CHAPTERS=[];
const pageCache={};
let cur=1;
const juzOf=(p)=>{ const j=Math.floor((p-1)/20)+1; return j>30?30:j; };

function ensureFont(name){
  if(!name||fontLoaded[name])return Promise.resolve();
  fontLoaded[name]=true;
  const file=(name==='QCF4_QBSML')?'QCF4_QBSML.woff2':name+'_W.woff2';
  const st=document.createElement('style');
  st.textContent=`@font-face{font-family:'${name}';src:url('${CDN}/fonts-woff2/${file}') format('woff2');font-display:block;}`;
  document.head.appendChild(st);
  try{ return document.fonts.load('32px "'+name+'"').then(()=>document.fonts.load('32px "QCF4_QBSML"')).catch(()=>{}); }
  catch(e){ return Promise.resolve(); }
}
async function loadPage(n){
  if(pageCache[n])return pageCache[n];
  const nn=String(n).padStart(3,'0');
  const res=await fetch(`${CDN}/pages/${nn}.json`);
  const data=await res.json();
  pageCache[n]=data;
  return data;
}
function surahNameFont(){ return 'QCF4_QBSML'; }
function fontsOf(data){
  const s=new Set([data.font,'QCF4_QBSML']);
  (data.lines||[]).forEach(l=>(l.words||[]).forEach(w=>{ if(w.font) s.add(w.font); }));
  return [...s];
}

function renderFolio(page){
  const fol=document.createElement('div'); fol.className='folio';
  let h='<div class="paper"><div class="mlines">';
  (page.lines||[]).forEach(line=>{
    const words=line.words||[];
    h+='<div class="mline">';
    words.forEach(w=>{
      const f=w.font||page.font;
      let cls='mw';
      if(w.type==='surah_header'){ cls+=' t-head'; }
      else if(w.type==='bismillah'){ cls+=' t-bism'; }
      else if(w.type==='end'){ cls+=' t-end'; }
      const vk=w.verse_key?` data-vk="${w.verse_key}"`:'';
      h+=`<span class="${cls}" style="font-family:'${f}','Amiri',serif"${vk}>${w.char}</span>`;
    });
    h+='</div>';
  });
  const sNames=(page.surahs||[]).map(s=>s.name_arabic).join('، ');
  h+='</div><div class="pfoot"><span class="juz">الجزء '+juzOf(page.page)+'</span><span>'+sNames+'</span></div>';
  h+='<div class="page-num">صفحة '+page.page+'</div></div>';
  fol.innerHTML=h;
  return fol;
}

/* ===== حجم الخط بمقياس ثابت (زي التطبيق): اللوحة تُرسم بعرض ثابت وتُكبَّر كوحدة ===== */
const DESIGN_W=620, DESIGN_INNER=DESIGN_W-44, BASE_FS=34;
let fs=parseFloat(localStorage.getItem('mushafFs')||'1');

function applyFs(){
  const r=document.getElementById('fsRange'); if(r)r.value=fs;
  const p=document.getElementById('fsPreview'); if(p)p.style.fontSize=(24*fs)+'px';
}
function setFs(v){ fs=Math.max(0.8,Math.min(2.4,Math.round(v*100)/100)); localStorage.setItem('mushafFs',fs); applyFs(); layout(); }
function openFont(){ applyFs(); document.getElementById('fontOv').classList.add('show'); }
function closeFont(){ document.getElementById('fontOv').classList.remove('show'); }

/* يضبط حجم الخط داخل اللوحة بحيث يملا عرضها مع بقاء كل سطر سطرًا واحدًا */
function fitPage(fol){
  const paper=fol.querySelector('.paper'); const ml=fol.querySelector('.mlines');
  if(!paper||!ml) return;
  paper.style.zoom='1';
  paper.querySelectorAll('.mline').forEach(l=>l.style.fontSize=BASE_FS+'px');
  let widest=0;
  ml.querySelectorAll('.mline').forEach(l=>{ widest=Math.max(widest,l.scrollWidth); });
  let size=BASE_FS*(DESIGN_INNER/Math.max(widest,1))*0.985;
  size=Math.max(20,Math.min(46,size));
  paper.querySelectorAll('.mline').forEach(l=>l.style.fontSize=size.toFixed(1)+'px');
}
/* يكبّر اللوحة كوحدة لتناسب الشاشة × معامل التكبير المختار */
function layout(){
  const stage=document.querySelector('.stage'); if(!stage)return;
  const avail=stage.clientWidth-16;
  const zoom=Math.max(0.4,Math.min(3,(avail/DESIGN_W)*fs));
  document.querySelectorAll('.folio').forEach(fol=>{
    fitPage(fol);
    const paper=fol.querySelector('.paper'); if(paper) paper.style.zoom=zoom;
  });
}
function relayout(){ requestAnimationFrame(layout); }

function position(el,page){
  const d=page-cur;                    // +1 = صفحة تالية (تظهر شمالًا)
  el.style.transform=`translateX(${(-d*100)}%)`;
  el.style.visibility=Math.abs(d)>1?'hidden':'visible';
  el.style.zIndex= d===0?2:1;
}
async function show(n){
  n=Math.max(1,Math.min(TOTAL,n));
  cur=n;
  const stage=document.getElementById('pages');
  const set=[n-1,n,n+1].filter(x=>x>=1&&x<=TOTAL);
  const want={};
  for(const x of set){
    let el=stage.querySelector('.folio[data-p="'+x+'"]');
    if(!el){
      el=document.createElement('div'); el.className='folio'; el.dataset.p=x; el.dataset.ready='';
      el.innerHTML='<div class="paper" style="align-items:center;justify-content:center;color:#9a9078"><i class="fas fa-spinner fa-spin"></i></div>';
      stage.appendChild(el);
    }
    want[x]=el; position(el,x);
  }
  [...stage.children].forEach(c=>{ if(!want[c.dataset.p]) c.remove(); });
  document.getElementById('tSub').textContent='صفحة '+n+' • الجزء '+juzOf(n);
  for(const x of set){
    const data=await loadPage(x);
    await Promise.all(fontsOf(data).map(f=>ensureFont(f)));
    const old=stage.querySelector('.folio[data-p="'+x+'"]');
    if(old && !old.dataset.ready){ const r=renderReady(x,data); old.replaceWith(r); position(r,x); }
  }
  relayout();
  document.fonts.ready.then(relayout);
}
window.addEventListener('resize',relayout);
function renderReady(n,data){
  const fol=renderFolio(data); fol.dataset.p=n; fol.dataset.ready='1'; return fol;
}
async function turn(dir){ show(cur+dir); }

/* swipes — اتجاه المصحف العربي: السحب لليمين = التالي */
(function(){
  const s=document.querySelector('.stage'); let sx=null;
  s.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  s.addEventListener('touchend',e=>{ if(sx==null)return; const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>55){ turn(dx>0?1:-1); } sx=null; },{passive:true});
  let msx=null;
  s.addEventListener('mousedown',e=>{msx=e.clientX;});
  s.addEventListener('mouseup',e=>{ if(msx==null)return; const dx=e.clientX-msx; if(Math.abs(dx)>70)turn(dx>0?1:-1); msx=null;});
})();

/* surah index */
async function openSurahs(){
  if(!CHAPTERS.length){
    try{ const idx=await (await fetch(`${CDN}/index.json`)).json(); CHAPTERS=idx.chapters; }
    catch(e){ CHAPTERS=[]; }
    buildSurahList(CHAPTERS);
  }
  document.getElementById('surahOv').classList.add('show');
}
function closeSurahs(){ document.getElementById('surahOv').classList.remove('show'); }
function buildSurahList(list){
  const el=document.getElementById('surahList');
  el.innerHTML=list.map(c=>`<div class="sitem" onclick="jumpSurah(${c.id})">
    <div class="no">${c.id}</div>
    <div class="nm"><b>سورة ${c.name_arabic}</b><span>${c.revelation_place==='makkah'?'مكية':'مدنية'} • ${c.verses_count} آية</span></div>
    <div class="pg">ص ${c.pages[0]}</div></div>`).join('');
}
function filterSurahs(q){
  q=q.trim();
  const f=CHAPTERS.filter(c=>c.name_arabic.includes(q)||String(c.id)===q);
  buildSurahList(f);
}
function jumpSurah(id){
  const c=CHAPTERS.find(x=>x.id===id);
  closeSurahs();
  if(c) show(c.pages[0]);
}
function goHome(){ location.href='index.html'; }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight')turn(1); if(e.key==='ArrowLeft')turn(-1); });

applyFs();
show(1);
</script>
</body>
</html>
