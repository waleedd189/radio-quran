<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>المصحف الشريف - راديو قرآن</title>
<meta name="description" content="مصحف القرآن الكريم كاملًا للقراءة (604 صفحة) مع التفسير والتسميع الصوتي — يعمل بدون إنترنت.">
<meta name="theme-color" content="#4CAF50">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --primary:#4CAF50; --primary-dark:#2E7D32; --paper:#1a1f1a;
  --text:#e8e8e8; --muted:#9aa59a; --gold:#d4af37; --border:#2e3a2e; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Cairo',sans-serif; min-height:100vh; color:var(--text);
  background:linear-gradient(135deg,#0d0d0d,#1b1b1b 60%,#242424); padding-bottom:40px;
  transition:background .3s,color .3s;
}
body.light{ --paper:#fffdf6; --text:#1a1a1a; --muted:#6b6b5e; --border:#e2dcc4; background:linear-gradient(135deg,#e9e4d4,#f4f1e6); }

.top-bar{position:sticky;top:0;z-index:50;background:rgba(12,14,12,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 12px;}
body.light .top-bar{background:rgba(255,253,246,.95);}
.top-row{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.back-btn,.t-btn{background:var(--primary);color:#fff;border:none;cursor:pointer;font-family:'Cairo';font-weight:700;padding:9px 16px;border-radius:22px;font-size:.9em;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.t-btn{background:transparent;color:var(--primary);border:1px solid var(--primary);padding:9px 12px;}
.t-btn:hover{background:var(--primary);color:#fff;}
.title{color:var(--gold);font-weight:700;font-size:1.05em;font-family:'Amiri',serif;}

.controls{max-width:820px;margin:10px auto 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;}
.controls select,.controls label{padding:9px 12px;border-radius:22px;border:1px solid var(--border);background:var(--paper);color:var(--text);font-family:'Cairo';font-size:.88em;outline:none;}
.controls label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
body.light .controls select{background:#fff;}

.page-meta{max-width:820px;margin:16px auto 6px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:.85em;padding:0 6px;flex-wrap:wrap;}

.mushaf-page{
  max-width:820px;margin:10px auto;background:var(--paper);border:2px solid var(--gold);
  border-radius:var(--radius);padding:26px 22px;min-height:60vh;box-shadow:0 10px 40px rgba(0,0,0,.5);
  position:relative;
}
body.light .mushaf-page{box-shadow:0 8px 30px rgba(0,0,0,.12);}
.surah-header{text-align:center;margin:20px 0 10px;}
.surah-name{
  display:inline-block;font-family:'Amiri',serif;font-weight:700;font-size:1.5em;color:var(--gold);
  border:2px solid var(--gold);border-radius:12px;padding:6px 26px;
}
.bismillah{text-align:center;font-family:'Amiri',serif;font-weight:700;font-size:2em;color:var(--text);margin:8px 0 20px;}

.aya-block{margin:14px 0;padding:6px 2px;border-radius:10px;transition:background .25s;}
.aya-block.playing{background:rgba(76,175,80,.12);box-shadow:inset 3px 0 0 var(--primary);}
.aya-text{font-family:'Amiri',serif;font-size:1.55em;line-height:2.4;text-align:justify;color:var(--text);word-spacing:2px;}
.aya-num-circle{
  display:inline-flex;align-items:center;justify-content:center;width:1.8em;height:1.8em;border-radius:50%;
  border:1.5px solid var(--gold);color:var(--gold);font-size:.62em;font-family:'Cairo';font-weight:700;margin:0 4px;vertical-align:middle;
}
.aya-tools{display:inline-flex;gap:6px;margin:0 6px;vertical-align:middle;}
.aya-tools button{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--muted);
  cursor:pointer;font-size:.8em;display:inline-flex;align-items:center;justify-content:center;transition:.2s;
}
.aya-tools button:hover{color:#fff;background:var(--primary);border-color:var(--primary);}
.aya-tools button.tafsir-on{color:var(--gold);border-color:var(--gold);}
.tafseer{
  display:none;margin:10px 4px 4px;padding:12px 14px;border-radius:12px;background:rgba(76,175,80,.08);
  border:1px solid rgba(76,175,80,.3);font-family:'Cairo';font-size:.95em;line-height:1.9;text-align:right;color:var(--text);
}
.tafseer.show{display:block;}
.tafseer .t-title{color:var(--primary);font-weight:700;margin-bottom:6px;font-size:.9em;}

.nav{max-width:820px;margin:18px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.nav button{background:var(--primary);color:#fff;border:none;cursor:pointer;font-family:'Cairo';font-weight:700;padding:11px 22px;border-radius:24px;font-size:.95em;display:inline-flex;align-items:center;gap:7px;}
.nav button:disabled{opacity:.4;cursor:not-allowed;}
.page-input{width:90px;text-align:center;padding:9px;border-radius:22px;border:1px solid var(--border);background:var(--paper);color:var(--text);font-family:'Cairo';font-weight:700;}
.loader{text-align:center;padding:60px 10px;color:var(--primary);}
.spinner{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--primary);color:#fff;padding:12px 24px;border-radius:26px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .35s;z-index:200;}
.toast.show{transform:translateX(-50%) translateY(0);}
@media(max-width:600px){ .aya-text{font-size:1.32em;} .mushaf-page{padding:18px 13px;} .surah-name{font-size:1.2em;} .bismillah{font-size:1.6em;} }
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-row">
    <a class="back-btn" href="index.html"><i class="fas fa-arrow-right"></i> رجوع</a>
    <span class="title">📖 المصحف الشريف</span>
    <div style="display:flex;gap:6px;">
      <button class="t-btn" onclick="changeFont(-1)" title="تصغير الخط"><i class="fas fa-minus"></i></button>
      <button class="t-btn" onclick="changeFont(1)" title="تكبير الخط"><i class="fas fa-plus"></i></button>
      <button class="t-btn" onclick="toggleNight()" title="الوضع"><i class="fas fa-moon" id="nightIcon"></i></button>
    </div>
  </div>
  <div class="controls">
    <select id="surahSel" onchange="goSurah(this.value)"><option value="">اذهب إلى سورة…</option></select>
    <select id="juzSel" onchange="goJuz(this.value)"><option value="">اذهب إلى جزء…</option></select>
    <select id="reciterSel" onchange="reciter=this.value; localStorage.setItem('mushafReciter',reciter);" title="صوت القارئ"></select>
    <label><input type="checkbox" id="contChk" onchange="localStorage.setItem('mushafCont',this.checked?'1':'0')"> <span>تسميع متتابع</span></label>
    <button class="t-btn" onclick="saveBookmark()"><i class="fas fa-bookmark"></i> حفظ الموضع</button>
  </div>
</div>

<div class="loader" id="loader"><div class="spinner"></div>جارٍ تحميل المصحف…</div>

<div id="reader" style="display:none;">
  <div class="page-meta">
    <span id="juzLabel"></span>
    <span id="pageLabel"></span>
  </div>
  <div class="mushaf-page" id="pageBox"></div>
  <div class="nav">
    <button id="nextBtn" onclick="goPage(current+1)"><i class="fas fa-chevron-right"></i> التالية</button>
    <div style="display:flex;align-items:center;gap:8px;">
      <input type="number" class="page-input" id="pageInput" min="1" max="604" value="1" onchange="goPage(parseInt(this.value))">
      <span style="color:var(--muted);">/ 604</span>
    </div>
    <button id="prevBtn" onclick="goPage(current-1)">السابقة <i class="fas fa-chevron-left"></i></button>
  </div>
</div>

<audio id="audioEl" preload="none"></audio>
<div class="toast" id="toast"></div>

<script>
let DATA=null, PAGES={}, SURAS=[], JUZ_FIRST={};
let current=1, fontSize=1.55, reciter='ar.alafasy';
const RECITERS=[
  {id:'ar.alafasy',name:'مشاري العفاسي'},
  {id:'ar.husary',name:'محمود خليل الحصري'},
  {id:'ar.minshawi',name:'محمد صديق المنشاوي'},
  {id:'ar.abdurrahmaansudais',name:'عبد الرحمن السديس'},
  {id:'ar.abdulbasitmurattal',name:'عبد الباسط عبد الصمد'},
  {id:'ar.mahermuaiqly',name:'ماهر المعيقلي'}
];
const audioEl=document.getElementById('audioEl');
const $=id=>document.getElementById(id);

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

function buildIndex(){
  for(const a of DATA){ (PAGES[a.page]=PAGES[a.page]||[]).push(a); if(!JUZ_FIRST[a.jozz])JUZ_FIRST[a.jozz]=a.page; }
  const map=new Map();
  DATA.forEach(a=>{ if(!map.has(a.sura_no)) map.set(a.sura_no,{no:a.sura_no,ar:a.sura_name_ar,page:a.page}); });
  SURAS=[...map.values()].sort((x,y)=>x.no-y.no);
  const ss=$('surahSel'), js=$('juzSel'), rs=$('reciterSel');
  SURAS.forEach(s=>{const o=document.createElement('option');o.value=s.no;o.textContent=s.no+'. '+s.ar;ss.appendChild(o);});
  for(let j=1;j<=30;j++){const o=document.createElement('option');o.value=j;o.textContent='الجزء '+j;js.appendChild(o);}
  RECITERS.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent='🔊 '+r.name;rs.appendChild(o);});
}

function renderPage(pno){
  if(pno<1)pno=1; if(pno>604)pno=604; current=pno;
  stopAudio();
  const ayas=PAGES[pno]||[];
  let html='';
  const juz=ayas.length?ayas[Math.floor(ayas.length/2)].jozz:1;
  for(const a of ayas){
    // بداية السورة فعلًا: أول آية منها (رقمها 1)
    if(a.aya_no===1){
      html+='<div class="surah-header"><span class="surah-name">'+esc(a.sura_name_ar)+'</span></div>';
      if(a.sura_no!==1 && a.sura_no!==9){
        html+='<div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>';
      }
    }
    html+='<div class="aya-block" id="aya-'+a.id+'">'+
      '<span class="aya-text">'+esc(a.aya_text_emlaey)+
      ' <span class="aya-num-circle">'+a.aya_no+'</span></span>'+
      '<span class="aya-tools">'+
        '<button title="استماع" onclick="playAya('+a.id+',this)"><i class="fas fa-play"></i></button>'+
        '<button title="التفسير" onclick="toggleTafsir('+a.id+',this)"><i class="fas fa-book-open"></i></button>'+
      '</span>'+
      '<div class="tafseer" id="tafseer-'+a.id+'"></div>'+
    '</div>';
  }
  const box=$('pageBox'); box.innerHTML=html; box.style.fontSize=fontSize+'em';
  $('pageLabel').textContent='الصفحة '+pno+' من 604';
  $('juzLabel').textContent='الجزء '+juz;
  $('pageInput').value=pno;
  $('prevBtn').disabled=pno<=1; $('nextBtn').disabled=pno>=604;
  $('surahSel').value=''; $('juzSel').value='';
  window.scrollTo({top:0,behavior:'smooth'});
  if(autoPlayGid){ const g=autoPlayGid; autoPlayGid=null; setTimeout(()=>playAya(g),250); }
}

// ---------- الصوت ----------
function stopAudio(){ try{audioEl.pause();}catch(e){} document.querySelectorAll('.aya-block.playing').forEach(el=>el.classList.remove('playing')); currentAya=null; }
let currentAya=null;
let autoPlayGid=null;
async function getAudioUrl(gid){
  const key='au_'+reciter+'_'+gid;
  try{ const c=localStorage.getItem(key); if(c) return c; }catch(e){}
  const r=await fetch('https://api.alquran.cloud/v1/ayah/'+gid+'/'+reciter);
  const d=await r.json();
  const url=d.data.audio;
  try{ localStorage.setItem(key,url); }catch(e){}
  return url;
}
async function playAya(gid,btn){
  // لو الآية دي شغالة حاليًا → إيقاف
  if(currentAya===gid && !audioEl.paused){ stopAudio(); return; }
  stopAudio();
  const block=document.getElementById('aya-'+gid);
  try{
    toast('🔊 جارٍ تحميل الصوت…');
    const url=await getAudioUrl(gid);
    audioEl.src=url; currentAya=gid;
    if(block) block.classList.add('playing');
    audioEl.onended=()=>{ if(block)block.classList.remove('playing'); currentAya=null; maybeNext(gid); };
    audioEl.onerror=()=>{ toast('⚠️ تعذر تشغيل الصوت'); if(block)block.classList.remove('playing'); };
    await audioEl.play();
    toast('▶️ تشغيل');
  }catch(e){ console.warn(e); toast('⚠️ تعذر تشغيل الصوت (يتطلب إنترنت أول مرة)'); }
}
function maybeNext(gid){
  if(!$('contChk').checked) return;
  const next=DATA.find(a=>a.id===gid+1);
  if(next){ autoPlayGid=next.id; if(next.page!==current) renderPage(next.page); else setTimeout(()=>playAya(next.id),60); }
}

// ---------- التفسير ----------
async function toggleTafsir(gid,btn){
  const panel=document.getElementById('tafseer-'+gid);
  if(panel.classList.contains('show')){ panel.classList.remove('show'); btn.classList.remove('tafsir-on'); return; }
  if(panel.innerHTML.trim()){ panel.classList.add('show'); btn.classList.add('tafsir-on'); return; }
  panel.innerHTML='<div class="t-title">📖 التفسير الميسر</div>جارٍ التحميل…'; panel.classList.add('show');
  try{
    const key='tf_'+gid; let txt=null;
    try{ txt=localStorage.getItem(key); }catch(e){}
    if(!txt){
      const r=await fetch('https://api.alquran.cloud/v1/ayah/'+gid+'/editions/quran-uthmani,ar.muyassar');
      const d=await r.json();
      txt=d.data[1].text;
      try{ localStorage.setItem(key,txt); }catch(e){}
    }
    panel.innerHTML='<div class="t-title">📖 التفسير الميسر</div>'+esc(txt);
    btn.classList.add('tafsir-on');
  }catch(e){ panel.innerHTML='<div class="t-title">📖 التفسير</div>تعذر تحميل التفسير (يتطلب إنترنت أول مرة).'; }
}

// ---------- التنقل ----------
function goPage(p){ if(!p||p<1)p=1; if(p>604)p=604; renderPage(p); localStorage.setItem('mushafPage',p); }
function goSurah(no){ if(!no)return; const s=SURAS.find(x=>x.no==no); if(s)goPage(s.page); $('surahSel').value=no; }
function goJuz(j){ if(!j)return; goPage(JUZ_FIRST[j]); $('juzSel').value=j; }
function saveBookmark(){ localStorage.setItem('mushafPage',current); toast('🔖 تم حفظ الموضع — صفحة '+current); }
function changeFont(d){ fontSize=Math.min(2.4,Math.max(1.1,fontSize+d*0.12)); $('pageBox').style.fontSize=fontSize+'em'; localStorage.setItem('mushafFont',fontSize); }
function toggleNight(){ document.body.classList.toggle('light'); const light=document.body.classList.contains('light'); $('nightIcon').className=light?'fas fa-sun':'fas fa-moon'; localStorage.setItem('mushafLight',light?'1':'0'); }

document.addEventListener('keydown',e=>{ if(!DATA)return; if(e.key==='ArrowLeft')goPage(current+1); if(e.key==='ArrowRight')goPage(current-1); });

fetch('data/quran.json').then(r=>r.json()).then(d=>{
  DATA=d; buildIndex();
  const f=parseFloat(localStorage.getItem('mushafFont')); if(!isNaN(f))fontSize=f;
  const svRec=localStorage.getItem('mushafReciter'); if(svRec){reciter=svRec; $('reciterSel').value=rec;} else $('reciterSel').value=reciter;
  if(localStorage.getItem('mushafCont')==='1')$('contChk').checked=true;
  if(localStorage.getItem('mushafLight')==='1'){document.body.classList.add('light');$('nightIcon').className='fas fa-sun';}
  const saved=parseInt(localStorage.getItem('mushafPage'));
  $('loader').style.display='none'; $('reader').style.display='block';
  goPage(saved>=1?saved:1);
}).catch(()=>{ $('loader').innerHTML='تعذر تحميل بيانات المصحف. تأكد من الاتصال أول مرة.'; });
</script>
</body>
</html>
