<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المصحف الشريف - راديو قرآن</title>
<meta name="theme-color" content="#22302b">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#22302b; --page:#2c3b35; --ink:#ece8da; --ink2:#a9b4ad; --accent:#7fd4c0; --accent2:#d4af6a;
  --gold:#d8b46a; --line:#41504a; --toolbar:#1b2521;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  font-family:'Cairo',Tahoma,sans-serif; color:var(--ink);
  background:var(--bg); overflow:hidden; direction:rtl;
  background-image:radial-gradient(circle at 50% 0%, #2a3a34, var(--bg));
}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:820px;margin:0 auto;
  min-width:0;}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--toolbar);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.tb{width:40px;height:40px;border-radius:10px;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.tb:active{background:var(--accent);}
.ttitle{flex:1;text-align:center;font-weight:800;font-size:15px;line-height:1.3;}
.ttitle small{display:block;font-size:11px;color:#9fb3b0;font-weight:600;}

/* The frame always fits the viewport. Only the measured text size changes. */
.stage{flex:1;min-height:0;min-width:0;overflow:hidden;position:relative;}
.pages{position:absolute;inset:0;}
.folio{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:6px;
  scrollbar-width:thin;overscroll-behavior:contain;touch-action:pan-y pinch-zoom;
  transition:transform .32s cubic-bezier(.22,1,.36,1);will-change:transform;}
.paper{
  width:100%;min-width:0;min-height:100%;margin:0 auto;background:var(--page);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);
  padding:12px 7px 10px;position:relative;display:flex;flex-direction:column;
}
.mlines{display:flex;flex:1;flex-direction:column;justify-content:space-around;gap:2px;
  min-width:0;width:100%;direction:rtl;}
.mline{display:flex;flex:0 0 auto;align-items:center;justify-content:center;
  width:100%;min-width:0;white-space:nowrap;direction:rtl;font-size:24px;line-height:1.85;
  padding:0 4px;}
.mrow{display:inline-flex;flex:0 0 auto;flex-wrap:nowrap;justify-content:space-between;
  align-items:center;direction:rtl;white-space:nowrap;column-gap:.02em;width:100%;}
.mline.is-centered .mrow{width:max-content;justify-content:center;}
.mw{display:inline-block;flex:0 0 auto;direction:ltr;unicode-bidi:isolate;
  font-size:inherit;line-height:inherit;padding:0;white-space:nowrap;cursor:default;}
.mw:active{background:rgba(216,180,106,.18);border-radius:5px;}
.mw.t-end{color:var(--gold);}
.mw.t-head{color:var(--accent);}
.mline[data-kind="head"]{margin:3px 0;}
.mline[data-kind="bism"]{margin:2px 0;}
.folio[data-p="1"] .mlines,.folio[data-p="2"] .mlines{justify-content:center;gap:10px;}
.folio[data-ready="1"]:not([data-fitted="1"]) .mlines{visibility:hidden;}
.pfoot{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;
  border-top:1px solid var(--line);margin-top:12px;padding-top:8px;font-size:12px;
  color:var(--ink2);font-weight:700;}
.pfoot .juz{color:var(--accent);}
.page-num{text-align:center;margin-top:5px;font-size:12px;color:var(--ink2);font-weight:700;}
.loading-paper{justify-content:center;align-items:center;}
.load-message{text-align:center;padding:20px;line-height:1.9;color:var(--ink2);font-size:14px;}
#hint{flex:0 0 auto;font-size:10px;padding:3px 8px calc(3px + env(safe-area-inset-bottom));}

/* overlay pickers */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
.ov.show{display:flex;}
.sheet{background:var(--toolbar);color:var(--ink);width:100%;max-width:820px;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:78vh;display:flex;flex-direction:column;animation:up .25s ease;border-top:1px solid var(--line);}
.sheet-sm{max-height:75vh;max-height:75dvh;overflow-y:auto;}
.sheet-sm>*{flex-shrink:0;}
@keyframes up{from{transform:translateY(40px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
.sheet h3{margin:0 0 14px;color:var(--gold);font-family:'Amiri';font-size:20px;display:flex;justify-content:space-between;align-items:center;}
.sheet h3 .x{background:none;border:none;font-size:20px;color:#9aa08a;cursor:pointer;}
.search{display:flex;align-items:center;gap:8px;background:#141a10;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;}
.search input{flex:1;border:none;outline:none;background:transparent;color:var(--ink);font-family:inherit;font-size:14px;}
.slist{overflow-y:auto;flex:1;}
.sitem{display:flex;align-items:center;gap:12px;padding:11px 10px;border-bottom:1px solid #2c3322;cursor:pointer;border-radius:8px;}
.sitem:active{background:#2c3322;}
.sitem .no{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:#2f3726;color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.sitem .nm{flex:1;}
.sitem .nm b{font-size:15px;color:var(--ink);}
.sitem .nm span{display:block;font-size:11px;color:#9aa08a;}
.sitem .pg{font-size:12px;color:var(--gold);font-weight:700;}
.tip{text-align:center;color:#9aa08a;font-size:12px;padding:6px 10px;}
.fontctl{display:flex;align-items:center;gap:16px;margin:8px 0 16px;}
.fbtn{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#2f3726;color:var(--gold);font-size:18px;cursor:pointer;}
.fbtn:active:not(:disabled){background:var(--gold);color:#141a10;}
.fbtn:disabled,.tb:disabled{opacity:.35;cursor:not-allowed;}
.fpreview output{display:block;font-family:inherit;font-size:13px;color:var(--accent);margin-top:4px;}
.range-ends{display:flex;justify-content:space-between;color:var(--ink2);font-size:11px;margin-top:10px;}
#fsLimit{min-height:44px;margin:12px 0 0;line-height:1.8;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
.fpreview{flex:1;text-align:center;overflow:hidden;}
.fpreview span{font-family:'Amiri',serif;color:var(--ink);font-size:24px;transition:font-size .12s;white-space:nowrap;}
#fsRange{width:100%;accent-color:var(--gold);height:6px;}
.frow{text-align:center;margin-top:12px;}
.freset{background:none;border:1px solid var(--line);color:var(--gold);border-radius:20px;padding:9px 20px;font-family:inherit;font-size:13px;cursor:pointer;}
@media(max-width:420px){
  .toolbar{gap:6px;padding:8px;}
  .tb{width:36px;height:36px;font-size:15px;}
  .ttitle{font-size:13px;min-width:0;}
  .ttitle small{font-size:10px;}
}
@media(prefers-reduced-motion:reduce){.folio,.sheet{transition:none;animation:none;}}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button class="tb" onclick="goHome()" title="الرئيسية"><i class="fas fa-home"></i></button>
    <button class="tb" id="prevPage" onclick="turn(-1)" title="السابق" aria-label="الصفحة السابقة"><i class="fas fa-chevron-right"></i></button>
    <div class="ttitle">المصحف الشريف<small id="tSub">صفحة 1</small></div>
    <button class="tb" id="nextPage" onclick="turn(1)" title="التالي" aria-label="الصفحة التالية"><i class="fas fa-chevron-left"></i></button>
    <button class="tb" id="fontButton" onclick="openFont()" title="حجم الخط" aria-label="حجم خط المصحف" aria-haspopup="dialog" aria-expanded="false" aria-controls="fontOv"><i class="fas fa-text-height"></i></button>
    <button class="tb" onclick="openSurahs()" title="الفهرس"><i class="fas fa-list"></i></button>
  </div>

  <div class="stage">
    <div class="pages" id="pages" aria-label="صفحات المصحف"></div>
  </div>
  <div class="tip" id="hint">اسحب لليمين للصفحة التالية • حجم الخط مضبوط داخل الإطار</div>
</div>

<!-- surah sheet -->
<div class="ov" id="surahOv" onclick="if(event.target===this)closeSurahs()">
  <div class="sheet">
    <h3>فهرس السور <button class="x" onclick="closeSurahs()"><i class="fas fa-xmark"></i></button></h3>
    <div class="search"><i class="fas fa-search" style="color:#999"></i><input id="surahQ" placeholder="ابحث عن سورة…" oninput="filterSurahs(this.value)"></div>
    <div class="slist" id="surahList"></div>
  </div>
</div>

<!-- font size sheet -->
<div class="ov" id="fontOv" role="dialog" aria-modal="true" aria-labelledby="fontTitle" onclick="if(event.target===this)closeFont()">
  <div class="sheet sheet-sm">
    <h3 id="fontTitle">حجم خط المصحف <button class="x" onclick="closeFont()" aria-label="إغلاق إعدادات الحجم"><i class="fas fa-xmark"></i></button></h3>
    <div class="fontctl">
      <button class="fbtn" id="fsMinus" onclick="setFs(fs-FS_STEP)" aria-label="تصغير الخط"><i class="fas fa-minus"></i></button>
      <div class="fpreview"><span id="fsPreview">بِسْمِ اللَّهِ</span><output id="fsValue" for="fsRange">١٠٠٪</output></div>
      <button class="fbtn" id="fsPlus" onclick="setFs(fs+FS_STEP)" aria-label="تكبير الخط"><i class="fas fa-plus"></i></button>
    </div>
    <label class="sr-only" for="fsRange">حجم الخط بالنسبة لأكبر حجم يناسب عرض الصفحة</label>
    <input type="range" id="fsRange" min="0.7" max="1" step="0.05" value="1" aria-describedby="fsLimit" oninput="setFs(this.value)">
    <div class="range-ends"><span>أصغر</span><span>أكبر حجم مناسب للشاشة</span></div>
    <p class="tip" id="fsLimit" role="status"></p>
    <div class="frow"><button class="freset" onclick="setFs(1)">استعادة الحجم المناسب للشاشة</button></div>
  </div>
</div>

<script src="data/mushaf-layout.js"></script>
<script>
const CDN="https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@main";
const TOTAL=604;
const fontLoaded=Object.create(null);
const loadedFaces=Object.create(null);
const fontUse=Object.create(null);
let fontClock=0;
const pageCache=Object.create(null);
const pageRequests=Object.create(null);
let CHAPTERS=[];
let cur=1;
let viewRequest=0;
let layoutRequest=0;
const juzOf=p=>Math.min(30,Math.floor((p-1)/20)+1);

// Await the actual QCF faces before rendering or measuring their private glyphs.
// Cache promises, not booleans: another page may request a face still loading.
function ensureFont(name){
  if(!name || !/^QCF4_[A-Za-z0-9_]+$/.test(name)) return Promise.reject(new Error('Invalid font'));
  fontUse[name]=++fontClock;
  if(fontLoaded[name]) return fontLoaded[name];
  const file=name==='QCF4_QBSML'?'QCF4_QBSML.woff2':name+'_W.woff2';
  const face=new FontFace(name,`url("${CDN}/fonts-woff2/${file}")`,{display:'block'});
  fontLoaded[name]=face.load().then(loaded=>{
    document.fonts.add(loaded);
    loadedFaces[name]=loaded;
    return loaded;
  }).catch(error=>{
    delete fontLoaded[name];
    throw error;
  });
  return fontLoaded[name];
}
async function loadPage(n){
  if(pageCache[n]) return pageCache[n];
  if(pageRequests[n]) return pageRequests[n];
  const nn=String(n).padStart(3,'0');
  pageRequests[n]=(async()=>{
    const res=await fetch(`${CDN}/pages/${nn}.json`);
    if(!res.ok) throw new Error('Page unavailable');
    const data=await res.json();
    if(data.page!==n || !Array.isArray(data.lines) || !data.lines.length) throw new Error('Invalid page');
    pageCache[n]=data;
    return data;
  })().finally(()=>{delete pageRequests[n];});
  return pageRequests[n];
}
function fontsOf(data){
  const names=new Set([data.font,'QCF4_QBSML']);
  data.lines.forEach(line=>line.words.forEach(word=>{if(word.font) names.add(word.font);}));
  return [...names].filter(Boolean);
}
// A long reading session must not retain all 48 large Quran font faces.
// Current + adjacent pages need at most four faces, including headings/basmalah.
function pruneFonts(){
  const needed=new Set(['QCF4_QBSML','QCF4_Hafs_01']);
  [cur-1,cur,cur+1].forEach(n=>{if(pageCache[n]) fontsOf(pageCache[n]).forEach(name=>needed.add(name));});
  const names=Object.keys(loadedFaces).sort((a,b)=>(fontUse[a]||0)-(fontUse[b]||0));
  let count=names.length;
  names.forEach(name=>{
    if(count<=4 || needed.has(name)) return;
    document.fonts.delete(loadedFaces[name]);
    delete loadedFaces[name];
    delete fontLoaded[name];
    delete fontUse[name];
    count--;
  });
}
function renderFolio(page){
  const fol=document.createElement('div');
  fol.className='folio';
  fol.dataset.p=page.page;
  const paper=document.createElement('div');
  paper.className='paper';
  const lines=document.createElement('div');
  lines.className='mlines';
  const centeredMask=typeof MUSHAF_CENTERED_LINES==='undefined'?0:(MUSHAF_CENTERED_LINES[page.page]||0);
  page.lines.forEach(line=>{
    const words=line.words||[];
    const el=document.createElement('div');
    el.className='mline';
    el.dataset.line=line.line;
    const kind=words.some(w=>w.type==='surah_header')?'head':words.some(w=>w.type==='bismillah')?'bism':'text';
    el.dataset.kind=kind;
    const centered=kind!=='text' || page.page<=2 || Boolean(centeredMask & (1<<(line.line-1)));
    el.classList.toggle('is-centered',centered);
    const row=document.createElement('div');
    row.className='mrow';
    words.forEach(w=>{
      const span=document.createElement('span');
      span.className='mw';
      if(w.type==='surah_header') span.classList.add('t-head');
      else if(w.type==='bismillah') span.classList.add('t-bism');
      else if(w.type==='end') span.classList.add('t-end');
      span.style.fontFamily=`"${w.font||page.font}", "Amiri", serif`;
      if(w.verse_key) span.dataset.vk=w.verse_key;
      span.textContent=w.char; // Keep every source glyph and its order unchanged.
      if(w.text) span.title=w.text;
      row.appendChild(span);
    });
    el.appendChild(row);
    lines.appendChild(el);
  });
  paper.appendChild(lines);
  const footer=document.createElement('div');
  footer.className='pfoot';
  const juz=document.createElement('span');
  juz.className='juz';
  juz.textContent='الجزء '+juzOf(page.page);
  const names=document.createElement('span');
  names.textContent=(page.surahs||[]).map(s=>s.name_arabic).join('، ');
  footer.append(juz,names);
  const number=document.createElement('div');
  number.className='page-num';
  number.textContent='صفحة '+page.page;
  paper.append(footer,number);
  fol.appendChild(paper);
  return fol;
}

/* Bounded text sizing. 100% = the largest size that fits this paper's real
   inner width. The PAPER is never zoomed, stretched, or enlarged off-screen. */
const FS_MIN=0.70, FS_MAX=1, FS_STEP=0.05;
const MEASURE_FS=40, WORD_GAP_EM=0.02, INK_GUTTER=3;
const measuringContext=document.createElement('canvas').getContext('2d');
function clampFs(value){
  value=Number(value);
  return Math.max(FS_MIN,Math.min(FS_MAX,Number.isFinite(value)?value:FS_MAX));
}
let fs=FS_MAX;
try{fs=clampFs(localStorage.getItem('mushafFs')||FS_MAX);}catch(e){}
function applyFs(){
  document.getElementById('fsRange').value=fs;
  const percent=Math.round(fs*100).toLocaleString('ar-EG')+'٪';
  document.getElementById('fsValue').textContent=percent;
  document.getElementById('fsRange').setAttribute('aria-valuetext',percent+' من أكبر حجم مناسب لعرض الصفحة');
  document.getElementById('fsPreview').style.fontSize=(24*fs)+'px';
  document.getElementById('fsMinus').disabled=fs<=FS_MIN+0.001;
  document.getElementById('fsPlus').disabled=fs>=FS_MAX-0.001;
  document.getElementById('fsLimit').textContent=fs>=FS_MAX-0.001
    ?'وصلت لأكبر حجم يناسب عرض الصفحة. زر الزيادة متوقف حتى لا تخرج أي كلمة من الإطار.'
    :'يمكنك زيادة الحجم حتى ١٠٠٪. تظل أسطر المصحف ثابتة، من غير قطع أو لفّ للكلمات.';
}
function setFs(value){
  fs=clampFs(Math.round(Number(value)*100)/100);
  try{localStorage.setItem('mushafFs',String(fs));}catch(e){}
  applyFs();
  relayout();
}
function openFont(){
  applyFs();
  document.getElementById('fontOv').classList.add('show');
  document.getElementById('fontButton').setAttribute('aria-expanded','true');
  document.getElementById('fsRange').focus({preventScroll:true});
}
function closeFont(){
  const overlay=document.getElementById('fontOv');
  if(!overlay.classList.contains('show')) return;
  overlay.classList.remove('show');
  document.getElementById('fontButton').setAttribute('aria-expanded','false');
  document.getElementById('fontButton').focus({preventScroll:true});
}

function measureFolio(fol){
  if(fol._lineMetrics) return fol._lineMetrics;
  const lines=[...fol.querySelectorAll('.mline')];
  lines.forEach(line=>{line.style.fontSize=MEASURE_FS+'px';});
  const metrics=lines.map(line=>{
    const words=[...line.querySelectorAll('.mw')];
    let advance=0,inkHeight=0;
    const glyphs=words.map(word=>{
      const width=word.getBoundingClientRect().width;
      advance+=width;
      if(!measuringContext) return {width,left:0,right:width};
      measuringContext.font=`${MEASURE_FS}px ${word.style.fontFamily}`;
      measuringContext.direction='ltr';
      measuringContext.textAlign='left';
      const glyph=measuringContext.measureText(word.textContent);
      inkHeight=Math.max(inkHeight,(glyph.actualBoundingBoxAscent||0)+(glyph.actualBoundingBoxDescent||0));
      return {width,left:glyph.actualBoundingBoxLeft||0,
        right:Number.isFinite(glyph.actualBoundingBoxRight)?glyph.actualBoundingBoxRight:width};
    });
    // Measure the OUTER ink of the complete RTL row, not the maximum overhang
    // of an internal word (which would unnecessarily make the whole page tiny).
    const naturalWidth=advance+Math.max(0,words.length-1)*WORD_GAP_EM*MEASURE_FS;
    let rightEdge=naturalWidth,minInk=0,maxInk=naturalWidth;
    glyphs.forEach(glyph=>{
      const leftEdge=rightEdge-glyph.width;
      minInk=Math.min(minInk,leftEdge-glyph.left);
      maxInk=Math.max(maxInk,leftEdge+glyph.right);
      rightEdge=leftEdge-WORD_GAP_EM*MEASURE_FS;
    });
    const leftInk=Math.max(0,-minInk),rightInk=Math.max(0,maxInk-naturalWidth);
    return {
      el:line,kind:line.dataset.kind,
      advance:advance/MEASURE_FS+Math.max(0,words.length-1)*WORD_GAP_EM,
      leftInk:Math.max(0,leftInk)/MEASURE_FS,
      rightInk:Math.max(0,rightInk)/MEASURE_FS,
      lineHeight:Math.max(1.85,inkHeight/MEASURE_FS+0.22)
    };
  });
  fol._lineMetrics=metrics;
  return metrics;
}
function fitPage(fol){
  if(fol.dataset.ready!=='1') return;
  const box=fol.querySelector('.mlines');
  const metrics=measureFolio(fol);
  if(!box || !metrics.length) return;
  // A second pass also covers browsers without stable scrollbar gutters.
  for(let pass=0;pass<2;pass++){
    const width=box.clientWidth;
    if(width<=0) return;
    const usable=Math.max(1,width-INK_GUTTER*2-1);
    const maximum=m=>usable/Math.max(0.01,m.advance+m.leftInk+m.rightInk);
    const ordinary=metrics.filter(m=>m.kind==='text');
    const bodyMax=Math.min(...(ordinary.length?ordinary:metrics).map(maximum));
    metrics.forEach(m=>{
      // Surah headings and the wide single-glyph basmalah have their own fonts.
      const desired=m.kind==='head'?bodyMax*1.15:m.kind==='bism'?bodyMax*1.05:bodyMax;
      const size=Math.floor(Math.min(desired,maximum(m))*fs*100)/100;
      m.el.style.fontSize=size+'px';
      m.el.style.lineHeight=String(m.lineHeight);
      m.el.style.paddingLeft=(INK_GUTTER+m.leftInk*size)+'px';
      m.el.style.paddingRight=(INK_GUTTER+m.rightInk*size)+'px';
    });
    if(box.clientWidth===width) break;
  }
  fol.dataset.fitted='1';
}
function layout(){
  layoutRequest=0;
  document.querySelectorAll('.folio[data-ready="1"]').forEach(fitPage);
}
function relayout(){
  if(!layoutRequest) layoutRequest=requestAnimationFrame(layout);
}
window.addEventListener('resize',relayout);
if('ResizeObserver' in window) new ResizeObserver(relayout).observe(document.querySelector('.stage'));

function position(el,page){
  const distance=page-cur;
  el.style.transform=`translateX(${-distance*100}%)`;
  el.style.visibility=Math.abs(distance)>1?'hidden':'visible';
  el.style.zIndex=distance===0?2:1;
  el.setAttribute('aria-hidden',distance===0?'false':'true');
  el.inert=distance!==0;
}
function loadingFolio(n){
  const el=document.createElement('div');
  el.className='folio';
  el.dataset.p=n;
  el.innerHTML='<div class="paper loading-paper"><div class="load-message" role="status"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i><p>جارٍ تحميل المصحف…</p></div></div>';
  return el;
}
function pageError(el,n){
  el.replaceChildren();
  const paper=document.createElement('div');
  paper.className='paper loading-paper';
  const message=document.createElement('div');
  message.className='load-message';
  const p=document.createElement('p');
  p.textContent='تعذّر تحميل الصفحة أو خطها. تحقّق من الاتصال بالإنترنت.';
  const retry=document.createElement('button');
  retry.className='freset';
  retry.type='button';
  retry.textContent='إعادة المحاولة';
  retry.onclick=()=>show(n);
  message.append(p,retry);
  paper.appendChild(message);
  el.appendChild(paper);
}
async function show(n){
  n=Number(n);
  n=Number.isFinite(n)?Math.max(1,Math.min(TOTAL,Math.round(n))):1;
  cur=n;
  const ticket=++viewRequest;
  const stage=document.getElementById('pages');
  const wanted=[n,n-1,n+1].filter(x=>x>=1&&x<=TOTAL);
  wanted.forEach(x=>{
    let el=stage.querySelector('.folio[data-p="'+x+'"]');
    if(!el){el=loadingFolio(x);stage.appendChild(el);}
    position(el,x);
  });
  [...stage.children].forEach(el=>{if(!wanted.includes(Number(el.dataset.p))) el.remove();});
  document.getElementById('tSub').textContent='صفحة '+n+' • الجزء '+juzOf(n);
  document.getElementById('prevPage').disabled=n===1;
  document.getElementById('nextPage').disabled=n===TOTAL;
  await Promise.all(wanted.map(async x=>{
    try{
      const data=await loadPage(x);
      if(ticket!==viewRequest) return;
      await Promise.all(fontsOf(data).map(ensureFont));
      if(ticket!==viewRequest) return;
      const old=stage.querySelector('.folio[data-p="'+x+'"]');
      if(old && old.dataset.ready!=='1'){
        const fol=renderReady(x,data);
        old.replaceWith(fol);
        position(fol,x);
        fitPage(fol);
      }
    }catch(error){
      if(ticket!==viewRequest) return;
      const el=stage.querySelector('.folio[data-p="'+x+'"]');
      if(el && el.dataset.ready!=='1') pageError(el,x);
    }finally{pruneFonts();}
  }));
  if(ticket===viewRequest) relayout();
}
function renderReady(n,data){
  const fol=renderFolio(data);
  fol.dataset.p=n;
  fol.dataset.ready='1';
  return fol;
}
function turn(direction){return show(cur+direction);}

/* Horizontal gesture = page turn; vertical scrolling and pinch gestures do not
   turn pages. Arabic mushaf: a swipe to the RIGHT goes to the NEXT page. */
(function(){
  const stage=document.querySelector('.stage');
  const pointers=new Set();
  let start=null;
  stage.addEventListener('pointerdown',event=>{
    if(event.button!==0 || event.target.closest('button,a,input')) return;
    pointers.add(event.pointerId);
    if(pointers.size!==1){start=null;return;}
    start={x:event.clientX,y:event.clientY,page:cur};
    try{stage.setPointerCapture(event.pointerId);}catch(e){}
  });
  stage.addEventListener('pointerup',event=>{
    pointers.delete(event.pointerId);
    if(!start) return;
    const dx=event.clientX-start.x,dy=event.clientY-start.y;
    if(start.page===cur && Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.4) turn(dx>0?1:-1);
    start=null;
  });
  stage.addEventListener('pointercancel',event=>{pointers.delete(event.pointerId);start=null;});
})();

/* surah index */
async function openSurahs(){
  if(!CHAPTERS.length){
    try{ const idx=await (await fetch(`${CDN}/index.json`)).json(); CHAPTERS=idx.chapters; }
    catch(e){ CHAPTERS=[]; }
    buildSurahList(CHAPTERS);
  }
  document.getElementById('surahOv').classList.add('show');
}
function closeSurahs(){ document.getElementById('surahOv').classList.remove('show'); }
function buildSurahList(list){
  const el=document.getElementById('surahList');
  el.innerHTML=list.map(c=>`<div class="sitem" onclick="jumpSurah(${c.id})">
    <div class="no">${c.id}</div>
    <div class="nm"><b>سورة ${c.name_arabic}</b><span>${c.revelation_place==='makkah'?'مكية':'مدنية'} • ${c.verses_count} آية</span></div>
    <div class="pg">ص ${c.pages[0]}</div></div>`).join('');
}
function filterSurahs(q){
  q=q.trim();
  const f=CHAPTERS.filter(c=>c.name_arabic.includes(q)||String(c.id)===q);
  buildSurahList(f);
}
function jumpSurah(id){
  const c=CHAPTERS.find(x=>x.id===id);
  closeSurahs();
  if(c) show(c.pages[0]);
}
function goHome(){ location.href='index.html'; }
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeFont();closeSurahs();return;}
  if(document.querySelector('.ov.show') || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight'){e.preventDefault();turn(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();turn(-1);}
});
