<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المصحف الشريف - راديو قرآن</title>
<meta name="theme-color" content="#1d2b2b">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#f4efe3; --page:#fbf7ec; --ink:#1d2b2b; --ink2:#4a5454; --accent:#0f7d63; --accent2:#a8791f;
  --gold:#b08a3e; --line:#d8cfb8; --toolbar:#20302f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:'Cairo',Tahoma,sans-serif; color:var(--ink);
  background:var(--bg); overflow:hidden; direction:rtl;
  background-image:radial-gradient(circle at 50% 0%, #f7f2e6, var(--bg));
}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:820px;margin:0 auto;}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--toolbar);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.tb{width:40px;height:40px;border-radius:10px;border:none;background:rgba(255,255,255,.08);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.tb:active{background:var(--accent);}
.ttitle{flex:1;text-align:center;font-weight:800;font-size:15px;line-height:1.3;}
.ttitle small{display:block;font-size:11px;color:#9fb3b0;font-weight:600;}

/* page stage */
.stage{flex:1;overflow:hidden;position:relative;}
.pages{position:absolute;inset:0;}
.folio{position:absolute;inset:0;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;
  transition:transform .32s cubic-bezier(.22,1,.36,1); will-change:transform;}
.paper{
  background:var(--page); border:1px solid var(--line); border-radius:14px;
  box-shadow:0 8px 26px rgba(120,100,50,.18);
  padding:14px 12px 8px; flex:1; display:flex; flex-direction:column;
  background-image:linear-gradient(rgba(176,138,62,.04),rgba(176,138,62,.04));
}
.mlines{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;direction:rtl;}
.mline{display:flex;align-items:center;justify-content:center;width:100%;min-height:28px;line-height:1.9;}
.mline .mw{font-size:clamp(23px,7.4vw,34px); direction:rtl; cursor:default; transition:background .15s; white-space:nowrap;}
.mline .mw:active{background:rgba(15,125,99,.10);border-radius:6px;}
.mline.surahh{justify-content:center;}
.mline.surahh .mw{font-size:30px;}
.pfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:8px;padding-top:6px;font-size:12px;color:var(--ink2);font-weight:700;}
.pfoot .juz{color:var(--accent2);}
.page-num{text-align:center;margin-top:6px;font-size:12px;color:var(--ink2);font-weight:700;}

/* overlay pickers */
.ov{position:fixed;inset:0;background:rgba(10,20,18,.55);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
.ov.show{display:flex;}
.sheet{background:#fff;width:100%;max-width:820px;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:78vh;display:flex;flex-direction:column;animation:up .25s ease;}
@keyframes up{from{transform:translateY(40px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
.sheet h3{margin:0 0 12px;color:var(--accent);font-family:'Amiri';font-size:20px;display:flex;justify-content:space-between;align-items:center;}
.sheet h3 .x{background:none;border:none;font-size:20px;color:#888;cursor:pointer;}
.search{display:flex;align-items:center;gap:8px;background:#f1efe6;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;}
.search input{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:14px;}
.slist{overflow-y:auto;flex:1;}
.sitem{display:flex;align-items:center;gap:12px;padding:11px 10px;border-bottom:1px solid #eee;cursor:pointer;border-radius:8px;}
.sitem:active{background:#f4f8f6;}
.sitem .no{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:#eaf4f0;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.sitem .nm{flex:1;}
.sitem .nm b{font-size:15px;}
.sitem .nm span{display:block;font-size:11px;color:#888;}
.sitem .pg{font-size:12px;color:var(--accent2);font-weight:700;}
.tip{text-align:center;color:var(--ink2);font-size:12px;padding:6px 10px;}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button class="tb" onclick="openSurahs()" title="الفهرس"><i class="fas fa-list"></i></button>
    <button class="tb" onclick="turn(-1)" title="السابق"><i class="fas fa-chevron-right"></i></button>
    <div class="ttitle">المصحف الشريف<small id="tSub">صفحة 1</small></div>
    <button class="tb" onclick="turn(1)" title="التالي"><i class="fas fa-chevron-left"></i></button>
    <button class="tb" onclick="goHome()" title="الرئيسية"><i class="fas fa-home"></i></button>
  </div>

  <div class="stage">
    <div class="pages" id="pages">
      <div class="folio"><div class="paper"><div class="tip" style="margin:auto">جارٍ تحميل المصحف…</div></div></div>
    </div>
    <div class="tip" id="hint">اسحب يمينًا/شمالًا للتنقل بين الصفحات • اضغط <i class="fas fa-list"></i> لاختيار السورة</div>
  </div>
</div>

<!-- surah sheet -->
<div class="ov" id="surahOv" onclick="if(event.target===this)closeSurahs()">
  <div class="sheet">
    <h3>فهرس السور <button class="x" onclick="closeSurahs()"><i class="fas fa-xmark"></i></button></h3>
    <div class="search"><i class="fas fa-search" style="color:#999"></i><input id="surahQ" placeholder="ابحث عن سورة…" oninput="filterSurahs(this.value)"></div>
    <div class="slist" id="surahList"></div>
  </div>
</div>

<script>
const CDN="https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@main";
const TOTAL=604;
const fontLoaded={};
// chapter metadata (snapshot for the index; also used offline-ish)
let CHAPTERS=[];
const pageCache={};
let cur=1;
const juzOf=(p)=>{ const j=Math.floor((p-1)/20)+1; return j>30?30:j; };

function ensureFont(name){
  if(!name||fontLoaded[name])return Promise.resolve();
  fontLoaded[name]=true;
  const file=(name==='QCF4_QBSML')?'QCF4_QBSML.woff2':name+'_W.woff2';
  const st=document.createElement('style');
  st.textContent=`@font-face{font-family:'${name}';src:url('${CDN}/fonts-woff2/${file}') format('woff2');font-display:block;}`;
  document.head.appendChild(st);
  try{ return document.fonts.load('32px "'+name+'"').then(()=>document.fonts.load('32px "QCF4_QBSML"')).catch(()=>{}); }
  catch(e){ return Promise.resolve(); }
}
async function loadPage(n){
  if(pageCache[n])return pageCache[n];
  const nn=String(n).padStart(3,'0');
  const res=await fetch(`${CDN}/pages/${nn}.json`);
  const data=await res.json();
  pageCache[n]=data;
  return data;
}
function surahNameFont(){ return 'QCF4_QBSML'; }

function renderFolio(page){
  const fol=document.createElement('div'); fol.className='folio';
  let h='<div class="paper"><div class="mlines">';
  (page.lines||[]).forEach(line=>{
    const words=line.words||[];
    const isHeader=words.some(w=>w.type==='surah_header');
    h+=`<div class="mline${isHeader?' surahh':''}"><span class="mw">`;
    words.forEach(w=>{
      if(w.type==='surah_header'){
        h+=`<span data-f="QCF4_QBSML">${w.char}</span>`;
      } else {
        const f=w.font||page.font;
        h+=`<span data-f="${f}" data-vk="${w.verse_key||''}">${w.char}</span>`;
      }
    });
    h+='</span></div>';
  });
  const sNames=(page.surahs||[]).map(s=>s.name_arabic).join('، ');
  h+='</div><div class="pfoot"><span class="juz">الجزء '+juzOf(page.page)+'</span><span>'+sNames+'</span></div>';
  h+='<div class="page-num">صفحة '+page.page+'</div></div>';
  fol.innerHTML=h;
  // apply fonts per glyph
  fol.querySelectorAll('[data-f]').forEach(el=>{ el.style.fontFamily=`'${el.dataset.f}','Amiri',serif`; });
  return fol;
}

function position(el,page){
  const d=page-cur;                    // +1 = صفحة تالية (تظهر شمالًا)
  el.style.transform=`translateX(${(-d*100)}%)`;
  el.style.visibility=Math.abs(d)>1?'hidden':'visible';
  el.style.zIndex= d===0?2:1;
}
async function show(n){
  n=Math.max(1,Math.min(TOTAL,n));
  cur=n;
  const stage=document.getElementById('pages');
  const set=[n-1,n,n+1].filter(x=>x>=1&&x<=TOTAL);
  const want={};
  for(const x of set){
    let el=stage.querySelector('.folio[data-p="'+x+'"]');
    if(!el){
      el=document.createElement('div'); el.className='folio'; el.dataset.p=x; el.dataset.ready='';
      el.innerHTML='<div class="paper" style="align-items:center;justify-content:center;color:#9a9078"><i class="fas fa-spinner fa-spin"></i></div>';
      stage.appendChild(el);
    }
    want[x]=el; position(el,x);
  }
  [...stage.children].forEach(c=>{ if(!want[c.dataset.p]) c.remove(); });
  document.getElementById('tSub').textContent='صفحة '+n+' • الجزء '+juzOf(n);
  for(const x of set){
    const data=await loadPage(x);
    ensureFont(data.font); ensureFont('QCF4_QBSML');
    const old=stage.querySelector('.folio[data-p="'+x+'"]');
    if(old && !old.dataset.ready){ const r=renderReady(x,data); old.replaceWith(r); position(r,x); }
  }
}
function renderReady(n,data){
  const fol=renderFolio(data); fol.dataset.p=n; fol.dataset.ready='1'; return fol;
}
async function turn(dir){ show(cur+dir); }

/* swipes */
(function(){
  const s=document.querySelector('.stage'); let sx=null;
  s.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  s.addEventListener('touchend',e=>{ if(sx==null)return; const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>55){ turn(dx<0?1:-1); } sx=null; },{passive:true});
  let msx=null;
  s.addEventListener('mousedown',e=>{msx=e.clientX;});
  s.addEventListener('mouseup',e=>{ if(msx==null)return; const dx=e.clientX-msx; if(Math.abs(dx)>70)turn(dx<0?1:-1); msx=null;});
})();

/* surah index */
async function openSurahs(){
  if(!CHAPTERS.length){
    try{ const idx=await (await fetch(`${CDN}/index.json`)).json(); CHAPTERS=idx.chapters; }
    catch(e){ CHAPTERS=[]; }
    buildSurahList(CHAPTERS);
  }
  document.getElementById('surahOv').classList.add('show');
}
function closeSurahs(){ document.getElementById('surahOv').classList.remove('show'); }
function buildSurahList(list){
  const el=document.getElementById('surahList');
  el.innerHTML=list.map(c=>`<div class="sitem" onclick="jumpSurah(${c.id})">
    <div class="no">${c.id}</div>
    <div class="nm"><b>سورة ${c.name_arabic}</b><span>${c.revelation_place==='makkah'?'مكية':'مدنية'} • ${c.verses_count} آية</span></div>
    <div class="pg">ص ${c.pages[0]}</div></div>`).join('');
}
function filterSurahs(q){
  q=q.trim();
  const f=CHAPTERS.filter(c=>c.name_arabic.includes(q)||String(c.id)===q);
  buildSurahList(f);
}
function jumpSurah(id){
  const c=CHAPTERS.find(x=>x.id===id);
  closeSurahs();
  if(c) show(c.pages[0]);
}
function goHome(){ location.href='index.html'; }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')turn(1); if(e.key==='ArrowRight')turn(-1); });

show(1);
</script>
</body>
</html>
